name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # PR ではマージコミットの 1 つ目の親（base）と比べて harness の差分を出す
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            OUT=$(node scripts/verify-gate.mjs --ci-diff-check --base HEAD^1)
            echo "$OUT"
            BUILD=$(node -e 'console.log(JSON.parse(process.argv[1]).affects_app_build)' "$OUT")
            echo "run_build=$BUILD" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run lint
      - run: npm run check:harness -- ${{ github.event_name == 'pull_request' && '--base HEAD^1' || '' }}
      - run: npm run type-check
      - run: npm test
      - if: steps.scope.outputs.run_build == 'true'
        run: npm run build

  # 実ブラウザ（headless Chromium + SwiftShader）で 3D 描画とカメラ判定を確かめる。
  # ローカルでは新しいブラウザを起動しない方針のため、CI で回す。
  # PR でアプリ本体・ビルド・e2e に関わらない変更（docs / harness / unit test のみ）のときは省略し、main では必ず回す。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            OUT=$(node scripts/verify-gate.mjs --ci-diff-check --base HEAD^1)
            echo "$OUT"
            E2E=$(node -e 'console.log(JSON.parse(process.argv[1]).affects_e2e)' "$OUT")
            echo "run_e2e=$E2E" >> "$GITHUB_OUTPUT"
          else
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.run_e2e == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - if: steps.scope.outputs.run_e2e == 'true'
        run: npm ci
      - if: steps.scope.outputs.run_e2e == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.scope.outputs.run_e2e == 'true'
        name: 偽カメラ映像を生成する
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m pip install --user pillow
          tests/e2e/fixtures/generate.sh
      - if: steps.scope.outputs.run_e2e == 'true'
        run: npm run test:e2e
      - if: failure() && steps.scope.outputs.run_e2e == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
      - if: always() && steps.scope.outputs.run_e2e == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots
          path: test-results/screens/
          retention-days: 7

  # main へのマージ（push）で、check と e2e が通ったあとに本番へ出す。
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
