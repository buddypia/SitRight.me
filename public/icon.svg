<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Dark titanium obsidian background -->
    <linearGradient id="snapAngularBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12151d"/>
      <stop offset="1" stop-color="#07090c"/>
    </linearGradient>
    <linearGradient id="snapAngularRim" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2d3545"/>
      <stop offset="1" stop-color="#10131a"/>
    </linearGradient>

    <!-- Matte Graphite Pillar Shading -->
    <linearGradient id="snapAngularGraphite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4454"/>
      <stop offset="100%" stop-color="#1e2430"/>
    </linearGradient>
    <linearGradient id="snapAngularTilted" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#242c3b"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with Subtle Beveled Rim -->
  <rect width="64" height="64" rx="16" fill="url(#snapAngularBg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="url(#snapAngularRim)" stroke-width="1.5"/>

  <!-- MACRO ACOUSTIC BURST RINGS (16pxでも消えない太めの衝撃音響波) -->
  <circle cx="32" cy="32" r="14" stroke="#ff3b30" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="32" cy="32" r="9" stroke="#ff9500" stroke-opacity="0.6" stroke-width="2.2"/>

  <!-- LOWER 3 VERTICAL SEGMENTS (整然と直立した下部柱) -->
  <rect x="29" y="50" width="13" height="4.5" rx="2" fill="url(#snapAngularGraphite)"/>
  <rect x="29" y="43" width="13" height="4.5" rx="2" fill="url(#snapAngularGraphite)"/>
  <rect x="29" y="36" width="13" height="4.5" rx="2" fill="url(#snapAngularGraphite)"/>

  <!-- UPPER 2 DRAMATICALLY SNAPPED SEGMENTS (約42°の大胆な「く」の字破断) -->
  <g transform="rotate(-42 32 32)">
    <rect x="27" y="27" width="13" height="4.5" rx="2" fill="url(#snapAngularTilted)"/>
    <rect x="27" y="20" width="13" height="4.5" rx="2" fill="#e2e8f0"/>
  </g>

  <!-- SOLID BURST STAR & PRONGS (破断頂点で弾ける極太のパキッ！閃光スター) -->
  <polygon points="32,23 35,29 43,32 35,35 32,41 29,35 21,32 29,29" fill="#ff9500"/>
  <polygon points="32,26 34,30 39,32 34,34 32,38 30,34 25,32 30,30" fill="#ffffff"/>
  <circle cx="32" cy="32" r="2.2" fill="#ffcc00"/>
</svg>
