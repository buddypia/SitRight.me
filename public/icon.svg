<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="absBgA" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14171f"/>
      <stop offset="1" stop-color="#090b0e"/>
    </linearGradient>
    <linearGradient id="absRimA" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2d3748"/>
      <stop offset="1" stop-color="#141820"/>
    </linearGradient>
    <!-- Geometric ribbon gradients -->
    <linearGradient id="healthyUpright" x1="32" y1="52" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10b981"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="slouchForward" x1="32" y1="34" x2="20" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff3b30"/>
      <stop offset="1" stop-color="#ff9500"/>
    </linearGradient>
  </defs>

  <!-- Clean Obsidian Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#absBgA)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="url(#absRimA)" stroke-width="1.5"/>

  <!-- Ideal reference axis (very subtle guideline) -->
  <line x1="33" y1="14" x2="33" y2="50" stroke="#34d399" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="2 3"/>

  <!-- ACOUSTIC SOUND RINGS (Clean geometric ripples of the 'snap') -->
  <circle cx="33" cy="33" r="16" stroke="#ff3b30" stroke-opacity="0.2" stroke-width="1.2" stroke-dasharray="2 3"/>
  <circle cx="33" cy="33" r="10" stroke="#ff9500" stroke-opacity="0.45" stroke-width="1.5"/>
  <circle cx="33" cy="33" r="5" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.5"/>

  <!-- ABSTRACT SPINE: Sculptural Minimal S-Ribbon -->
  <!-- Lower upright column -->
  <path d="M33 51 L 33 33" stroke="url(#healthyUpright)" stroke-width="5" stroke-linecap="round"/>
  <!-- Segment tick marks (minimal tactile notches) -->
  <circle cx="33" cy="46" r="1.5" fill="#14171f"/>
  <circle cx="33" cy="39" r="1.5" fill="#14171f"/>

  <!-- Forward tilted upper head/neck ribbon (sharp snap at (33, 33)) -->
  <path d="M33 33 L 19 19" stroke="url(#slouchForward)" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Minimal Head/Apex Node -->
  <circle cx="17" cy="17" r="4.5" fill="#f8fafc"/>
  <circle cx="17" cy="17" r="2" fill="#ff3b30" fill-opacity="0.8"/>

  <!-- Central Acoustic Energy Spark -->
  <circle cx="33" cy="33" r="2.5" fill="#ffffff"/>
</svg>
