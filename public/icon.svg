<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Dark titanium obsidian background -->
    <linearGradient id="pureMonoBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12151d"/>
      <stop offset="1" stop-color="#07090c"/>
    </linearGradient>
    <linearGradient id="pureMonoRim" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2d3545"/>
      <stop offset="1" stop-color="#10131a"/>
    </linearGradient>

    <!-- Sleek Monolith Segment Shading (Matte Graphite) -->
    <linearGradient id="graphiteSegment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4454"/>
      <stop offset="100%" stop-color="#1e2430"/>
    </linearGradient>

    <linearGradient id="tiltedSegment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#242c3b"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with Subtle Beveled Rim -->
  <rect width="64" height="64" rx="16" fill="url(#pureMonoBg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="url(#pureMonoRim)" stroke-width="1.5"/>

  <!-- PAPER-THIN ACOUSTIC SHOCKWAVE RINGS (抽象案4の極薄光輪音波リング) -->
  <circle cx="34" cy="30" r="18" stroke="#ff3b30" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="2 3"/>
  <circle cx="34" cy="30" r="12" stroke="#ff9500" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="34" cy="30" r="6" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.5"/>

  <!-- LOWER 3 UPRIGHT MONOLITH SEGMENTS (整然と直立した浮遊モノリス柱) -->
  <!-- Segment 1 (Lowest) -->
  <rect x="28" y="50" width="12" height="4.5" rx="2" fill="url(#graphiteSegment)"/>
  <!-- Segment 2 (Middle) -->
  <rect x="28" y="43" width="12" height="4.5" rx="2" fill="url(#graphiteSegment)"/>
  <!-- Segment 3 (Pivot) -->
  <rect x="28" y="36" width="12" height="4.5" rx="2" fill="url(#graphiteSegment)"/>

  <!-- UPPER 2 TILTED MONOLITH SEGMENTS (悪姿勢で前方にズレ・傾斜した浮遊ブロック) -->
  <!-- Segment 4 (Cervical - Tilted -30 deg) -->
  <g transform="rotate(-30 31 29)">
    <rect x="25" y="27" width="12" height="4.5" rx="2" fill="url(#tiltedSegment)"/>
  </g>

  <!-- Segment 5 (Top Apex - Tilted -48 deg) -->
  <g transform="rotate(-48 24 20)">
    <rect x="18" y="17" width="12" height="4.5" rx="2" fill="#e2e8f0"/>
  </g>

  <!-- PURE ACOUSTIC SPARK (中心の繊細な純白光点) -->
  <circle cx="34" cy="30" r="2.2" fill="#ffffff"/>
  <circle cx="34" cy="30" r="1" fill="#ffcc00"/>
</svg>
