<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Dark titanium obsidian background -->
    <linearGradient id="v10bBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#181c24"/>
      <stop offset="1" stop-color="#090b0e"/>
    </linearGradient>
    <linearGradient id="v10bRim" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#363f52"/>
      <stop offset="1" stop-color="#141820"/>
    </linearGradient>

    <!-- Vertebrae Block Metal Shading -->
    <linearGradient id="v10bBlockGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#323b4a"/>
      <stop offset="60%" stop-color="#1e2430"/>
      <stop offset="100%" stop-color="#12161f"/>
    </linearGradient>

    <!-- 3D Acoustic Cone Beams -->
    <linearGradient id="v10bBeamGrad" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with Subtle Beveled Rim -->
  <rect width="64" height="64" rx="16" fill="url(#v10bBg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="url(#v10bRim)" stroke-width="1.5"/>

  <!-- RIGHT SOLID ACOUSTIC ARCS (右側の二重ソリッド音波アーク) -->
  <path d="M 44,18 A 20 20 0 0 1 44,46" stroke="#ff3b30" stroke-width="3" stroke-linecap="round"/>
  <path d="M 40,22 A 14 14 0 0 1 40,42" stroke="#ff9500" stroke-width="3" stroke-linecap="round"/>

  <!-- CONNECTOR JOINTS (椎骨ブロック間の関節コネクタ) -->
  <rect x="28" y="19" width="8" height="3" rx="1" fill="#0d1117"/>
  <rect x="28" y="43" width="8" height="3" rx="1" fill="#0d1117"/>

  <!-- 4 VERTEBRAE BONE BLOCKS (4つのチタン椎骨ブロック) -->
  <!-- Block 1 (Cervical / Top) -->
  <rect x="23" y="11" width="18" height="8.5" rx="2.5" fill="url(#v10bBlockGrad)" stroke="#475569" stroke-width="0.8"/>

  <!-- Block 2 (Thoracic Upper - 楔状に面取り) -->
  <polygon points="23,22 41,22 41,27 27,31.5 23,31.5" fill="url(#v10bBlockGrad)" stroke="#475569" stroke-width="0.8"/>

  <!-- Block 3 (Thoracic Lower - 楔状に面取り) -->
  <polygon points="23,32.5 27,32.5 41,37 41,42 23,42" fill="url(#v10bBlockGrad)" stroke="#475569" stroke-width="0.8"/>

  <!-- Block 4 (Lumbar / Base) -->
  <rect x="23" y="45" width="18" height="8.5" rx="2.5" fill="url(#v10bBlockGrad)" stroke="#475569" stroke-width="0.8"/>

  <!-- 3D SOLID ACOUSTIC CONE BEAMS (楔開口部から噴出する3本の音波コーン) -->
  <!-- Upper Diagonal Beam -->
  <polygon points="28,32 46,24 44,28" fill="url(#v10bBeamGrad)"/>
  <!-- Center Main Beam -->
  <polygon points="28,32 52,32 49,34.5" fill="#ffcc00"/>
  <!-- Lower Diagonal Beam -->
  <polygon points="28,32 44,36 46,40" fill="url(#v10bBeamGrad)"/>

  <!-- Core Acoustic Spark -->
  <circle cx="28" cy="32" r="2.2" fill="#ffffff"/>
  <circle cx="28" cy="32" r="1.2" fill="#ff9500"/>
</svg>
