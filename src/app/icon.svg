<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Dark titanium obsidian background -->
    <linearGradient id="v10cBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#181c24"/>
      <stop offset="1" stop-color="#090b0e"/>
    </linearGradient>
    <linearGradient id="v10cRim" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#363f52"/>
      <stop offset="1" stop-color="#141820"/>
    </linearGradient>

    <!-- Vertebrae Block Metal Shading -->
    <linearGradient id="v10cBlockGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#384356"/>
      <stop offset="50%" stop-color="#222a38"/>
      <stop offset="100%" stop-color="#12161f"/>
    </linearGradient>
    <linearGradient id="v10cBlockTilted" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#445268"/>
      <stop offset="50%" stop-color="#2a3446"/>
      <stop offset="100%" stop-color="#141a24"/>
    </linearGradient>

    <!-- 3D Acoustic Cone Horn Wedge -->
    <linearGradient id="v10cHornGrad" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#ff9500"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with Subtle Beveled Rim -->
  <rect width="64" height="64" rx="16" fill="url(#v10cBg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="url(#v10cRim)" stroke-width="1.5"/>

  <!-- DOUBLE SOLID ACOUSTIC ARCS (右側の二重ソリッド音波アーク) -->
  <path d="M 45,18 A 20 20 0 0 1 45,46" stroke="#ff3b30" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 40,22 A 14 14 0 0 1 40,42" stroke="#ff9500" stroke-width="3" stroke-linecap="round"/>

  <!-- LOWER 2 UPRIGHT VERTEBRAE (直立した下部椎骨ブロック) -->
  <!-- Block 3 (Bottom Lumbar) -->
  <g>
    <rect x="23" y="41" width="14" height="11" rx="2.5" fill="url(#v10cBlockGrad)" stroke="#475569" stroke-width="0.8"/>
    <!-- Left spinous process (棘突起) -->
    <rect x="17" y="44" width="7" height="5.5" rx="1.5" fill="url(#v10cBlockGrad)" stroke="#475569" stroke-width="0.8"/>
  </g>

  <!-- Block 2 (Mid Lumbar) -->
  <g>
    <rect x="23" y="27" width="14" height="11" rx="2.5" fill="url(#v10cBlockGrad)" stroke="#475569" stroke-width="0.8"/>
    <rect x="17" y="30" width="7" height="5.5" rx="1.5" fill="url(#v10cBlockGrad)" stroke="#475569" stroke-width="0.8"/>
  </g>

  <!-- UPPER FORWARD-TILTED VERTEBRA (前傾した胸椎・頸椎ブロック) -->
  <g transform="rotate(-18 28 26)">
    <rect x="22" y="13" width="14" height="11" rx="2.5" fill="url(#v10cBlockTilted)" stroke="#475569" stroke-width="0.8"/>
    <rect x="16" y="16" width="7" height="5.5" rx="1.5" fill="url(#v10cBlockTilted)" stroke="#475569" stroke-width="0.8"/>
  </g>

  <!-- 3D ACOUSTIC CONE HORN (楔開口部から突き出す音波ホーン) -->
  <polygon points="26,27 40,20 40,34" fill="url(#v10cHornGrad)"/>
  <polygon points="26,27 40,20 34,26" fill="#ffcc00"/>

  <!-- Core Acoustic Spark -->
  <circle cx="26" cy="27" r="2.2" fill="#ffffff"/>
  <circle cx="26" cy="27" r="1.2" fill="#ff9500"/>
</svg>
