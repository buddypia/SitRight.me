<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Titanium border gradient -->
    <linearGradient id="tiBorder" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4a5260"/>
      <stop offset="0.5" stop-color="#2a303c"/>
      <stop offset="1" stop-color="#141820"/>
    </linearGradient>
    
    <!-- Red stress fracture glow -->
    <filter id="stressGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="lowerSpine" x1="32" y1="52" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#4deac4"/>
    </linearGradient>

    <linearGradient id="bentSpine" x1="32" y1="34" x2="22" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff3b30"/>
      <stop offset="1" stop-color="#ff9500"/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Base -->
  <rect width="64" height="64" rx="16" fill="#0c0e12"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="url(#tiBorder)" stroke-width="1.5"/>

  <!-- Subtle ideal vertical reference axis (faint) -->
  <line x1="34" y1="12" x2="34" y2="52" stroke="#4deac4" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Lower spine (Upright thoracic / lumbar, healthy emerald) -->
  <path d="M34 52 C 34 46, 33 40, 33 34" stroke="url(#lowerSpine)" stroke-width="4" stroke-linecap="round"/>
  <!-- Vertebrae rings on lower spine -->
  <circle cx="34" cy="50" r="2.2" fill="#2dd4bf"/>
  <circle cx="33.5" cy="42" r="2.2" fill="#4deac4"/>

  <!-- Sharp Buckle / Snap Point at C5-C7 (Neck snapping forward) -->
  <!-- Fractured bent cervical spine path leaning sharply forward -->
  <path d="M33 34 L 23 20" stroke="url(#bentSpine)" stroke-width="4.2" stroke-linecap="round"/>

  <!-- Forward-dropped Head node -->
  <circle cx="21" cy="16" r="4.5" fill="#eef0f2"/>

  <!-- Stress fracture lightning cracks and burst at snap point -->
  <g filter="url(#stressGlow)">
    <!-- Primary sharp fracture zig-zag -->
    <path d="M30 36 L 34 32 L 28 30 L 36 27" stroke="#ff2d55" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="33" r="3" fill="#ff3b30" fill-opacity="0.7"/>
    <circle cx="32" cy="33" r="1.5" fill="#fff"/>
  </g>
</svg>
