<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Dark titanium obsidian background -->
    <linearGradient id="v8aBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12151d"/>
      <stop offset="1" stop-color="#07090c"/>
    </linearGradient>
    <linearGradient id="v8aRim" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2d3545"/>
      <stop offset="1" stop-color="#10131a"/>
    </linearGradient>

    <!-- Platinum & Slate Ribbon Gradients -->
    <linearGradient id="sRibbonUpper" x1="16" y1="12" x2="48" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="sRibbonLower" x1="16" y1="28" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with Subtle Beveled Rim -->
  <rect width="64" height="64" rx="16" fill="url(#v8aBg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="url(#v8aRim)" stroke-width="1.5"/>

  <!-- ACOUSTIC SHOCKWAVE PULSE (極小サイズでもパキッ！の音響衝撃を伝える波紋) -->
  <circle cx="32" cy="32" r="13" stroke="#ff3b30" stroke-width="1.8" stroke-opacity="0.35" stroke-dasharray="5 3"/>
  <circle cx="32" cy="32" r="8" stroke="#ff9500" stroke-width="1.8" stroke-opacity="0.55"/>

  <!-- GEOMETRIC S-GLYPH RIBBON (SitRight & Spineの超抽象S字キネティックグリフ) -->
  <!-- Upper Curve (Forward flexion arc - 姿勢の前傾・頸椎) -->
  <path d="M 44,16 C 30,12 18,20 22,30 C 24,35 29,34 32,32" stroke="url(#sRibbonUpper)" stroke-width="5.5" stroke-linecap="round"/>
  
  <!-- Lower Curve (Upright base arc - 直立する骨盤・腰椎) -->
  <path d="M 32,32 C 35,30 40,29 42,34 C 46,44 34,52 20,48" stroke="url(#sRibbonLower)" stroke-width="5.5" stroke-linecap="round"/>

  <!-- RADIANT EQUILIBRIUM PIVOT & SNAP SPARK (中央で均衡とパキッ！の破断臨界点を告げるダイヤモンド閃光) -->
  <polygon points="32,23 34.5,29.5 41,32 34.5,34.5 32,41 29.5,34.5 23,32 29.5,29.5" fill="#ff9500"/>
  <polygon points="32,26 33.5,30.5 38,32 33.5,33.5 32,38 30.5,33.5 26,32 30.5,30.5" fill="#ffffff"/>
  <circle cx="32" cy="32" r="2.2" fill="#ffcc00"/>
</svg>
